// Server plugin (Paper / Spigot / Purpur 1.20.4+): lets players with Musicmod see each other's capes.
// Build: ../gradlew -p server-plugin build   ->  server-plugin/build/libs/MusicmodCapes.jar
plugins {
    id 'java'
}

group = 'dev.servergunnik.musicmod'
version = '1.0.0'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName = 'MusicmodCapes.jar'
}
